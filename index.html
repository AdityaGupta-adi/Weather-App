<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="weather-card">

        <h1>🌦 Weather App</h1>

        <div class="search-box">
            <input type="text" id="city" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>
        <button id="locationBtn">📍 Use My Location</button>

        <div id="loader" class="loader" style="display:none;"></div>
        <div id="errorBox" class="error-box" style="display:none;">
    ❌ City not found. Please check the spelling.
        </div>

        <div id="weather">

            <img id="icon" src="" alt="">

            <h2 id="cityName">City Name</h2>

            <h1 id="temp">--°C</h1>

            <p id="condition">Weather Condition</p>

            <div class="details">

                <div>
                    <h3>💧 Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div>
                    <h3>🌬 Wind</h3>
                    <p id="wind">-- km/h</p>
                </div>

            </div>
<div class="extra-details">

<div class="extra-card">
<h3>🌡️ Feels Like</h3>
<p id="feelsLike">--°C</p>
</div>

<div class="extra-card">
<h3>👁️ Visibility</h3>
<p id="visibility">-- km</p>
</div>

<div class="extra-card">
<h3>📊 Pressure</h3>
<p id="pressure">-- hPa</p>
</div>

<div class="extra-card">
<h3>🌅 Sunrise</h3>
<p id="sunrise">--:--</p>
</div>

<div class="extra-card">
<h3>🌇 Sunset</h3>
<p id="sunset">--:--</p>
</div>

</div>
            <h2 class="forecast-title">5-Day Forecast</h2>

<div id="forecast" class="forecast-container">

</div>
            <h2 class="forecast-title">Recent Searches</h2>

<div id="recentSearches"></div>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
